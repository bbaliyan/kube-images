# Minimal Cilium for the first boot: just enough CNI for the node to become
# Ready. It is rendered into /opt/kube-compute/manifests/cilium.yaml at build
# time. kube-compute's bootstrap removes it once Cilium is Ready, and the
# platform then manages Cilium.
kubeProxyReplacement: true
# RKE2 runs without kube-proxy, so the agent reaches the API server directly.
k8sServiceHost: "127.0.0.1"
k8sServicePort: 6443
operator:
  # The chart default of 2 replicas stays Pending on a single node.
  replicas: 1
  tolerations:
    - operator: Exists
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
