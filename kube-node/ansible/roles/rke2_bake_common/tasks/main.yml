---
# SPDX-License-Identifier: Apache-2.0
# Bake tasks for the AlmaLinux 10 node image: OS prep, RKE2 install.
# Template cleanup lives in rke2_bake_template_prep and provider-only tasks in rke2_bake_<provider>.

- name: os-prep | wait for first-boot cloud-init to finish, rc 2 meaning done with recoverable errors
  ansible.builtin.command: cloud-init status --wait
  register: cloud_init_wait
  changed_when: false
  failed_when: cloud_init_wait.rc not in [0, 2]

# First, so a proxy that re-signs TLS is trusted by every download below.
- name: os-prep | install the CA certificate
  ansible.builtin.copy:
    src: "{{ trusted_ca_path }}"
    dest: /etc/pki/ca-trust/source/anchors/trusted-ca.crt
    mode: "0644"
    owner: root
    group: root
  when: trusted_ca_path | length > 0

- name: os-prep | rebuild the trust store
  ansible.builtin.command: update-ca-trust extract
  when: trusted_ca_path | length > 0
  changed_when: true

- name: os-prep | inotify limits
  ansible.builtin.copy:
    src: 99-rke2-inotify.conf
    dest: /etc/sysctl.d/99-rke2-inotify.conf
    mode: "0644"
  register: inotify_conf

- name: os-prep | apply inotify limits immediately
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-rke2-inotify.conf
  when: inotify_conf.changed

- name: os-prep | permanently quiesce background dnf/rpm-lock holders
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - packagekit
    - packagekit.socket
    - dnf-makecache.timer
    - dnf-makecache.service
  failed_when: false

- name: os-prep | update every package
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true
  register: dnf_update
  retries: 3
  delay: 15
  until: dnf_update is succeeded

# Unconditional, not gated on a needs-restarting check: a full dnf update
# against a stale base image needs a reboot on virtually every bake anyway
# (kernel/glibc bumps are near-universal), so the check cost more build time
# on average than it saved. The reboot is deferred so the command returns
# before the connection drops.
- name: os-prep | reboot after the OS update
  ansible.builtin.reboot:
    reboot_command: systemd-run --on-active=5 /usr/bin/systemctl reboot
    reboot_timeout: 600
    connect_timeout: 15
    post_reboot_delay: 30

# AlmaLinux 10's minimal image ships only kernel-modules-core, which
# excludes nft_compat (the iptables-nft translation shim). Cilium's default
# VXLAN mode needs it — without it, Cilium's iptables reconciliation fails
# and freshly created pods become unreachable. "-matched" (not a pinned
# NVR): BaseOS only keeps this subpackage for the latest kernel, so a pinned
# request can match nothing.
- name: os-prep | install ca-certificates, curl, git, the SELinux tools and policy, and kernel-modules-extra for Cilium's nft_compat
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - container-selinux
      - curl
      - git
      - kernel-modules-extra-matched
      - policycoreutils-python-utils
    state: present
  register: os_packages
  retries: 3
  delay: 15
  until: os_packages is succeeded

# RHEL10 kernels (6.12+) dropped br_netfilter — bridged traffic is filtered
# natively via nftables bridge hooks. RHEL9 kernels still ship it and need
# both.
- name: os-prep | load overlay, nft_compat and, on kernels that still have it, br_netfilter; enable forwarding
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      modprobe nft_compat
      if modinfo br_netfilter >/dev/null 2>&1; then
        printf 'br_netfilter\noverlay\n' >/etc/modules-load.d/rke2.conf
        modprobe br_netfilter
      else
        printf 'overlay\n' >/etc/modules-load.d/rke2.conf
      fi
      modprobe overlay
      printf 'net.ipv4.ip_forward = 1\n' >/etc/sysctl.d/98-rke2-bridge.conf
      if [ -d /proc/sys/net/bridge ]; then
        printf 'net.bridge.bridge-nf-call-iptables = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\n' >>/etc/sysctl.d/98-rke2-bridge.conf
      fi
      sysctl --system
    creates: /etc/modules-load.d/rke2.conf

- name: os-prep | label the local-path-provisioner directory for container write access
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      mkdir -p /var/lib/rancher/local-path-provisioner
      local_rules="$(semanage fcontext -l -C)"
      if ! grep -qF '/var/lib/rancher/local-path-provisioner(/.*)?' <<<"${local_rules}"; then
        semanage fcontext -a -t container_file_t '/var/lib/rancher/local-path-provisioner(/.*)?'
      fi
      restorecon -R /var/lib/rancher/local-path-provisioner
    executable: /bin/bash
  changed_when: true

# A new domain and file type only: no existing domain changes, so a bad
# module fails the bake here and cannot affect a boot. The udica templates
# come with container-selinux and must load in the same transaction.
- name: selinux | detect whether SELinux is enabled on the build host
  ansible.builtin.command: selinuxenabled
  register: selinux_enabled
  changed_when: false
  failed_when: selinux_enabled.rc not in [0, 1]

- name: selinux | skip the node-exporter policy module, SELinux is disabled
  ansible.builtin.debug:
    msg: SELinux is disabled on the build host, so the node-exporter policy module is not installed.
  when: selinux_enabled.rc != 0

- name: selinux | install the node-exporter policy module and label its textfile directory
  when: selinux_enabled.rc == 0
  block:
    - name: selinux | copy the node-exporter policy module
      ansible.builtin.copy:
        src: node_exporter.cil
        dest: /usr/local/share/node_exporter.cil
        mode: "0644"
        owner: root
        group: root
      register: node_exporter_cil

    - name: selinux | list the installed policy modules
      ansible.builtin.command: semodule -l
      register: policy_modules
      changed_when: false

    - name: selinux | load the node-exporter policy module with the udica templates
      ansible.builtin.command:
        argv:
          - semodule
          - -i
          - /usr/share/udica/templates/base_container.cil
          - /usr/share/udica/templates/net_container.cil
          - /usr/local/share/node_exporter.cil
      when: node_exporter_cil.changed or (policy_modules.stdout_lines | select('match', '^node_exporter(\s|$)') | list | length == 0)
      changed_when: true

    - name: selinux | create the textfile collector directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: selinux | label the textfile collector directory for the node-exporter domain
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          local_rules="$(semanage fcontext -l -C)"
          if ! grep -qF '/var/lib/node_exporter/textfile_collector(/.*)?' <<<"${local_rules}"; then
            semanage fcontext -a -t node_exporter.textfile_t '/var/lib/node_exporter/textfile_collector(/.*)?'
          fi
          restorecon -R /var/lib/node_exporter
        executable: /bin/bash
      changed_when: true

# The same repositories get.rke2.io adds. The minor-version repo keeps every
# recent patch build available at once, so all four packages are installed
# in one transaction pinned to the exact version; installed separately,
# dnf can land rke2-common on a different patch than rke2-server.
- name: rke2 | add the Rancher RKE2 repositories
  ansible.builtin.yum_repository:
    name: "{{ item.name }}"
    description: "{{ item.name }}"
    baseurl: "{{ item.baseurl }}"
    gpgcheck: true
    gpgkey: https://rpm.rancher.io/public.key
  loop:
    - name: rancher-rke2-common-stable
      baseurl: "https://rpm.rancher.io/rke2/stable/common/centos/{{ ansible_facts['distribution_major_version'] }}/noarch"
    - name: "rancher-rke2-{{ rke2_minor }}-stable"
      baseurl: "https://rpm.rancher.io/rke2/stable/{{ rke2_minor }}/centos/{{ ansible_facts['distribution_major_version'] }}/$basearch"
  vars:
    rke2_minor: "{{ k8s_version | regex_replace('^v([0-9]+[.][0-9]+)[.].*$', '\\1') }}"
  when: bake_install_rke2

- name: rke2 | import the Rancher GPG key
  ansible.builtin.rpm_key:
    key: https://rpm.rancher.io/public.key
    state: present
  register: gpg_import
  retries: 3
  delay: 10
  until: gpg_import is succeeded
  when: bake_install_rke2

# Both server and agent are baked in. Role selection (which unit to enable)
# is a launch-time decision.
# e.g. "v1.36.2+rke2r1" -> "1.36.2~rke2r1", the version rpm.rancher.io publishes.
- name: rke2 | install RKE2 server, agent and common, Kubernetes {{ k8s_version }}
  ansible.builtin.dnf:
    name:
      - rke2-selinux
      - "rke2-common-{{ rke2_rpm_version }}"
      - "rke2-server-{{ rke2_rpm_version }}"
      - "rke2-agent-{{ rke2_rpm_version }}"
    state: present
  vars:
    rke2_rpm_version: "{{ k8s_version | regex_replace('^v', '') | regex_replace('[+-]', '~') }}"
  register: rke2_packages
  retries: 3
  delay: 15
  until: rke2_packages is succeeded
  when: bake_install_rke2
