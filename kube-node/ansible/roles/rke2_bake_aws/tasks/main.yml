---
# SPDX-License-Identifier: Apache-2.0
# AWS-only bake tasks, run alongside rke2_bake_common by
# kube-node/ansible/playbook-aws.yml.

# kube-compute reaches the nodes over Session Manager only. The AlmaLinux AMI
# ships the agent, but this task makes the dependency explicit, so a future
# AMI without it fails the build instead of leaving every node unreachable.
# The unit is enabled here, so the agent starts at boot with no user-data step.
- name: aws | verify the amazon-ssm-agent binary
  ansible.builtin.stat:
    path: /usr/bin/amazon-ssm-agent
  register: ssm_agent

# The GPG check is off on purpose. The RPM comes over HTTPS from the vendor's
# own bucket, and only when the binary is missing. AWS rotates the signing key
# about once a year, so a key pinned here would break builds.
- name: aws | install amazon-ssm-agent
  ansible.builtin.dnf:
    name: "https://s3.{{ aws_region }}.amazonaws.com/amazon-ssm-{{ aws_region }}/latest/linux_{{ ssm_agent_arch }}/amazon-ssm-agent.rpm"
    state: present
    disable_gpg_check: true
  vars:
    ssm_agent_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
  register: ssm_agent_install
  retries: 3
  delay: 15
  until: ssm_agent_install is succeeded
  when: not ssm_agent.stat.exists

- name: aws | enable amazon-ssm-agent at boot
  ansible.builtin.systemd:
    name: amazon-ssm-agent
    enabled: true

# kube-compute boot steps call `aws ssm get-parameter` and
# `aws s3api put-object --if-none-match`, so the image carries AWS CLI v2.
# The zip is pinned by version and SHA-256, and only fetched when the CLI is
# missing.
- name: aws | install unzip
  ansible.builtin.dnf:
    name: unzip
    state: present
  register: unzip_install
  retries: 3
  delay: 15
  until: unzip_install is succeeded

- name: aws | download the AWS CLI v2 zip
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ ansible_facts['architecture'] }}-{{ awscli_version }}.zip"
    dest: /tmp/awscliv2.zip
    checksum: "sha256:{{ awscli_sha256[ansible_facts['architecture']] }}"
    mode: "0600"
  register: awscli_download
  retries: 3
  delay: 15
  until: awscli_download is succeeded
  when: not ansible_check_mode

- name: aws | unpack the AWS CLI v2 zip
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
    creates: /usr/local/bin/aws
  when: not ansible_check_mode

- name: aws | install the AWS CLI v2
  ansible.builtin.command:
    cmd: /tmp/aws/install
    creates: /usr/local/bin/aws

- name: aws | remove the AWS CLI v2 download
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/awscliv2.zip
    - /tmp/aws
