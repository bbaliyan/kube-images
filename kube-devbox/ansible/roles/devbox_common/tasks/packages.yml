---
# SPDX-License-Identifier: Apache-2.0
- name: Packages | Docker repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: "{{ devbox_docker_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ devbox_docker_repo_gpgkey }}"

- name: Packages | Tailscale repository
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    baseurl: "{{ devbox_tailscale_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ devbox_tailscale_repo_gpgkey }}"

- name: Packages | install everything the box needs
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - tailscale
      - kernel-modules-extra
      - dnf-plugins-core
      - openssh-server
      - nftables
      - dnf-automatic
      - git
      - make
      - tar
      - jq
    state: present
    update_cache: true

# The install can pull in a newer kernel. The running kernel then lacks the netfilter
# modules that Docker needs (such as xt_addrtype), and dockerd fails to start. Reboot
# now, before the firewall units are enabled, so Packer can still log in.
- name: Packages | is a reboot needed for a new kernel
  ansible.builtin.command: dnf needs-restarting -r
  register: devbox_needs_reboot
  changed_when: false
  failed_when: devbox_needs_reboot.rc not in [0, 1]
  when: devbox_manage_services | bool

- name: Packages | reboot into the new kernel
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - devbox_manage_services | bool
    - devbox_needs_reboot.rc == 1
