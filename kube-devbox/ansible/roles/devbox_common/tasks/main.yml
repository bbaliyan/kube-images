---
# SPDX-License-Identifier: Apache-2.0
- name: Verify | the base image is the expected distribution
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == devbox_expected_distribution
      - ansible_facts["distribution_major_version"] == devbox_expected_major_version
    fail_msg: "The dev box image builds on AlmaLinux 10 only."
    success_msg: "Base image is AlmaLinux 10."

# The seed runs 'dnf upgrade' in cloud-init at the first boot. It holds the rpm lock and can
# install a new kernel, so the role waits for cloud-init before it touches packages.
- name: Wait | cloud-init has finished its first-boot work
  ansible.builtin.command: cloud-init status --wait
  register: devbox_cloud_init_status
  changed_when: false
  failed_when: devbox_cloud_init_status.rc not in [0, 2]
  when: devbox_manage_services | bool

- name: Import | packages and repositories
  ansible.builtin.import_tasks: packages.yml

- name: Import | SSH hardening
  ansible.builtin.import_tasks: ssh.yml

- name: Import | firewall inside the box
  ansible.builtin.import_tasks: firewall.yml

- name: Import | automatic security updates
  ansible.builtin.import_tasks: updates.yml

- name: Import | Docker settings and the prune timer
  ansible.builtin.import_tasks: docker.yml

# Pending reloads and restarts run now, before the image pull and the cleanup.
- name: Flush | run pending handlers
  ansible.builtin.meta: flush_handlers

- name: Import | the pinned dev container image
  ansible.builtin.import_tasks: devenv.yml

- name: Import | clean up so every clone starts fresh
  ansible.builtin.import_tasks: cleanup.yml
